<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RCV Training Portal — Prototype</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --ink:#15161C;
    --ink-soft:#787C86;
    --paper:#F3F4EE;
    --paper-raised:#FFFFFF;
    --line:#E9EAE2;
    --gold:#C2178C;
    --gold-deep:#8F0F66;
    --gold-tint:#FBE6F3;
    --sage:#5C7A0E;
    --sage-tint:#EFFBC4;
    --rust:#C1503A;
    --rust-tint:#FBE3DD;
    --peach:#FFD9AE;
    --peach-tint:#FFF1DE;
    --blue-pastel:#CDE9FB;
    --blue-tint:#E9F6FD;
    --yellow-pastel:#FFEDA6;
    --yellow-tint:#FFF9E1;
    --lavender-tint:#EEE9FB;
    --sidebar-bg:#15161C;
    --sidebar-bg-soft:#212330;
    --sidebar-text:#9498A3;
    --radius:14px;
    --radius-sm:10px;
    --radius-pill:999px;
    --serif:'Manrope', 'Inter', sans-serif;
    --sans:'Inter', -apple-system, sans-serif;
    --ease-out:cubic-bezier(0.23, 1, 0.32, 1);
    --ease-in-out:cubic-bezier(0.77, 0, 0.175, 1);
    --shadow-sm:0 1px 2px rgba(21,22,28,.04), 0 1px 1px rgba(21,22,28,.03);
    --shadow-md:0 8px 24px rgba(21,22,28,.07), 0 2px 6px rgba(21,22,28,.04);
    --shadow-lg:0 16px 40px rgba(21,22,28,.10), 0 4px 10px rgba(21,22,28,.05);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--sans);
    background:var(--paper);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}
  button{font-family:var(--sans);cursor:pointer;}
  ::selection{background:var(--gold-tint);}

  /* ---------- Layout shell ---------- */
  #app{min-height:100vh;display:flex;flex-direction:column;}

  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:20px 32px;border-bottom:1px solid var(--line);
    background:var(--paper-raised);
  }
  .brand{display:flex;align-items:center;gap:10px;cursor:pointer;}
  .brand-mark{
    width:32px;height:32px;border:none;background:var(--gold);border-radius:10px;
    display:flex;align-items:center;justify-content:center;color:#fff;
    font-family:var(--serif);font-size:15px;font-weight:800;
  }
  .brand-name{font-family:var(--serif);font-size:18px;font-weight:800;letter-spacing:0.1px;white-space:nowrap;}
  .brand-sub{font-size:11px;color:var(--ink-soft);margin-top:1px;white-space:nowrap;}
  .topbar-right{display:flex;align-items:center;gap:14px;font-size:13.5px;color:var(--ink-soft);}
  .pill{
    display:inline-flex;align-items:center;gap:7px;white-space:nowrap;
    font-size:12.5px;color:var(--ink-soft);font-weight:500;
  }
  .pill::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--gold);flex-shrink:0;}
  .btn{
    padding:13px 22px;border-radius:var(--radius-pill);border:1.5px solid var(--ink);
    background:var(--ink);color:var(--paper-raised);font-size:13.5px;font-weight:600;white-space:nowrap;
    transition:transform 140ms var(--ease-out), background 160ms ease, border-color 160ms ease, color 160ms ease, box-shadow 160ms ease;
  }
  .btn:hover{box-shadow:var(--shadow-sm);}
  .btn:active{transform:scale(0.97);}
  .btn.secondary{background:transparent;color:var(--ink);}
  .btn.secondary:hover{background:var(--ink);color:#fff;opacity:1;}
  .btn.ghost{border-color:var(--line);background:transparent;color:var(--ink-soft);}
  .btn.ghost:hover{border-color:var(--ink);color:var(--ink);opacity:1;}
  .btn.small{padding:9px 16px;font-size:12.5px;}
  .btn.gold{background:var(--gold);border-color:var(--gold);color:#fff;font-weight:700;}
  .btn.gold:hover{background:var(--gold-deep);border-color:var(--gold-deep);color:#fff;opacity:1;}
  .btn:disabled{opacity:.35;cursor:not-allowed;transform:none;box-shadow:none;}
  .btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold-deep);outline-offset:1px;}

  main{flex:1;width:100%;}

  /* ---------- Landing ---------- */
  .landing{max-width:920px;margin:0 auto;padding:88px 24px 60px;}
  .landing-eyebrow{font-size:13px;color:var(--gold-deep);margin-bottom:14px;font-weight:600;}
  .landing h1{
    font-family:var(--serif);font-size:44px;line-height:1.12;font-weight:800;
    margin:0 0 18px;max-width:11ch;letter-spacing:-0.5px;
  }
  .landing p.lede{font-size:16.5px;line-height:1.6;color:var(--ink-soft);max-width:52ch;margin:0 0 44px;}
  .entry-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;background:transparent;border:none;margin-bottom:8px;}
  .entry-card{background:var(--paper-raised);padding:30px 28px;display:flex;flex-direction:column;gap:14px;transition:transform 200ms var(--ease-out), box-shadow 200ms var(--ease-out);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow-sm);}
  @media (hover:hover) and (pointer:fine){
    .entry-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);}
  }
  .entry-card h3{font-family:var(--serif);font-size:21px;margin:0;font-weight:800;}
  .entry-card p{font-size:13.5px;color:var(--ink-soft);line-height:1.55;margin:0;flex:1;}
  .entry-num{font-size:12px;color:var(--gold-deep);font-variant-numeric:tabular-nums;font-weight:700;display:flex;align-items:center;gap:7px;margin-bottom:2px;}
  .entry-num::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--gold-deep);flex-shrink:0;}
  .landing-footer-row{margin-top:28px;font-size:13px;color:var(--ink-soft);}
  .landing-footer-row a{text-decoration:underline;text-underline-offset:3px;}

  /* ---------- Generic dashboard shell ---------- */
  .shell{display:flex;align-items:flex-start;min-height:calc(100vh - 68px);}
  .sidebar{
    width:266px;flex-shrink:0;background:var(--sidebar-bg);
    padding:26px 16px;display:flex;flex-direction:column;gap:2px;
    box-shadow:2px 0 12px rgba(0,0,0,.06);
    position:sticky;top:0;height:100vh;overflow-y:auto;z-index:1;
  }
  .sidebar-label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--sidebar-text);opacity:.7;padding:0 12px;margin-bottom:14px;}
  .nav-item{
    padding:13px 16px;font-size:14px;color:var(--sidebar-text);border-left:none;border-radius:var(--radius-pill);
    display:flex;align-items:center;justify-content:space-between;cursor:pointer;margin-bottom:4px;
    white-space:nowrap;
    transition:background 140ms var(--ease-out), color 140ms var(--ease-out);
  }
  .nav-item:hover{color:#fff;background:var(--sidebar-bg-soft);}
  .nav-item.active{color:#fff;background:var(--gold);font-weight:700;}
  .nav-item.active:hover{background:var(--gold);color:#fff;}
  .nav-count{font-size:11.5px;color:var(--sidebar-text);opacity:1;font-weight:700;font-variant-numeric:tabular-nums;}
  .nav-item.active .nav-count{color:#fff;}
  .content{flex:1;padding:40px 44px;max-width:1180px;}
  .content h2{font-family:var(--serif);font-size:27px;font-weight:800;margin:0 0 6px;letter-spacing:-0.3px;}
  .content .subtitle{color:var(--ink-soft);font-size:14px;margin:0 0 32px;}

  /* ---------- KPI row ---------- */
  .kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;background:transparent;border:none;margin-bottom:38px;}
  .kpi-row-5{grid-template-columns:repeat(5,1fr);}
  .kpi{background:var(--gold-tint);padding:20px 20px;border-radius:18px;box-shadow:var(--shadow-sm);}
  .kpi:nth-child(2){background:var(--peach-tint);}
  .kpi:nth-child(3){background:var(--blue-tint);}
  .kpi:nth-child(4){background:var(--yellow-tint);}
  .kpi:nth-child(5){background:var(--lavender-tint);}
  .kpi-value{font-family:var(--serif);font-size:28px;font-weight:800;}
  .kpi-label{font-size:12.5px;color:var(--ink-soft);margin-top:4px;}

  /* ---------- Table ---------- */
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{
    text-align:left;font-weight:700;color:var(--ink);font-size:11px;
    text-transform:uppercase;letter-spacing:.05em;padding:15px 16px;
    background:var(--paper);border-bottom:1.5px solid var(--line);
  }
  td{padding:14px 16px;border-bottom:1px solid var(--line);vertical-align:middle;transition:background 120ms var(--ease-out);}
  tr:last-child td{border-bottom:none;}
  tbody tr:hover td, table tr:hover td{background:var(--gold-tint);}
  .table-wrap{background:var(--paper-raised);border:1px solid var(--line);margin-bottom:36px;border-radius:18px;overflow:hidden;box-shadow:var(--shadow-sm);}
  .table-wrap table{border-radius:0;}

  .badge{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--ink);white-space:nowrap;}
  .badge::before{content:'';width:7px;height:7px;border-radius:50%;flex-shrink:0;background:currentColor;}
  .badge.pending{color:#9A5B12;}
  .badge.approved,.badge.active,.badge.published,.badge.completed{color:var(--gold-deep);}
  .badge.rejected,.badge.inactive,.badge.revoked{color:var(--rust);}
  .badge.draft{color:var(--ink-soft);}

  .row-actions{display:flex;gap:8px;}

  /* ---------- Course cards (student) ---------- */
  .course-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px;margin-bottom:38px;}
  .course-card{border:1px solid var(--line);background:var(--paper-raised);padding:18px;display:flex;flex-direction:column;gap:12px;transition:box-shadow 200ms var(--ease-out),transform 200ms var(--ease-out);border-radius:20px;box-shadow:var(--shadow-sm);}
  @media (hover:hover) and (pointer:fine){
    .course-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);}
  }
  .course-card .thumb{
    width:100%;aspect-ratio:16/10;border-radius:14px;position:relative;overflow:hidden;
    display:flex;align-items:flex-end;justify-content:flex-start;padding:12px;
  }
  .course-card .thumb-play{
    width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.92);color:var(--ink);
    display:flex;align-items:center;justify-content:center;font-size:13px;position:absolute;
    top:50%;left:50%;transform:translate(-50%,-50%);
  }
  .course-card .thumb-badge{
    background:rgba(21,22,28,.55);color:#fff;font-size:11px;padding:3px 9px;border-radius:6px;font-weight:600;
  }
  .course-card h4{font-family:var(--serif);font-size:17px;margin:0;font-weight:800;}
  .course-card p{font-size:13px;color:var(--ink-soft);margin:0;line-height:1.5;}
  .progress-track{height:6px;background:var(--line);border-radius:var(--radius-pill);overflow:hidden;margin-top:4px;}
  .progress-fill{height:100%;background:var(--gold);border-radius:var(--radius-pill);}
  .course-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);margin-top:2px;}

  .section-block{margin-bottom:40px;}
  .section-block h3{font-family:var(--serif);font-size:19px;font-weight:800;margin:0 0 14px;}

  .list-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:13px 0;border-bottom:1px solid var(--line);}
  .list-row:last-child{border-bottom:none;}

  /* ---------- Module list ---------- */
  .module-list{border:1px solid var(--line);background:var(--paper-raised);border-radius:18px;overflow:hidden;box-shadow:var(--shadow-sm);}
  .module-row{
    display:flex;align-items:center;gap:16px;padding:18px 22px;border-bottom:1px solid var(--line);
  }
  .module-row:last-child{border-bottom:none;}
  .module-row.locked{opacity:.5;}
  .reorder-col{display:flex;flex-direction:column;gap:2px;flex-shrink:0;}
  .reorder-btn{
    width:22px;height:18px;border:1px solid var(--line);background:var(--paper-raised);color:var(--ink-soft);
    font-size:9px;border-radius:5px;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:background 140ms var(--ease-out), color 140ms var(--ease-out);
  }
  .reorder-btn:hover:not(:disabled){background:var(--gold-tint);color:var(--gold-deep);border-color:var(--gold-deep);}
  .reorder-btn:disabled{opacity:.3;cursor:not-allowed;}
  .module-num{
    width:32px;height:32px;border-radius:50%;border:1.5px solid var(--ink);display:flex;
    align-items:center;justify-content:center;font-size:13px;font-family:var(--serif);font-weight:700;flex-shrink:0;
  }
  .module-num.done{background:var(--sage);border-color:var(--sage);color:#fff;}
  .module-num.locked{border-color:var(--line);color:var(--ink-soft);}
  .module-info{flex:1;}
  .module-info .mtitle{font-weight:600;font-size:14.5px;}
  .module-info .mstate{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}

  /* ---------- Video / module detail ---------- */
  .back-link{font-size:13px;color:var(--ink-soft);margin-bottom:18px;display:inline-block;}
  .video-frame{
    background:var(--ink);aspect-ratio:16/8.2;border-radius:20px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;gap:14px;
    margin-bottom:16px;position:relative;overflow:hidden;
  }
  .video-frame::before{
    content:"";position:absolute;inset:0;
    background:repeating-linear-gradient(115deg, rgba(255,255,255,0.03) 0 2px, transparent 2px 34px);
  }
  .play-btn{
    width:54px;height:54px;border-radius:50%;background:var(--gold);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:18px;z-index:1;
  }
  .video-caption{font-size:13px;color:rgba(255,255,255,.7);z-index:1;}
  .video-actions{display:flex;align-items:center;gap:14px;margin-bottom:28px;}
  .watched-tag{font-size:13px;color:var(--sage);display:flex;align-items:center;gap:6px;font-weight:600;}

  /* ---------- Quiz ---------- */
  .quiz-card{border:1px solid var(--line);background:var(--paper-raised);padding:26px 28px;border-radius:20px;box-shadow:var(--shadow-sm);}
  .q-block{margin-bottom:26px;}
  .q-block:last-of-type{margin-bottom:8px;}
  .q-num{font-size:11.5px;color:var(--gold-deep);margin-bottom:6px;font-weight:700;}
  .q-text{font-size:15px;font-weight:600;margin-bottom:12px;}
  .opt{
    display:flex;align-items:center;gap:10px;padding:11px 16px;border:1.5px solid var(--line);
    border-radius:var(--radius-pill);margin-bottom:8px;font-size:13.5px;cursor:pointer;
    transition:border-color 140ms var(--ease-out), background 140ms var(--ease-out), transform 100ms var(--ease-out);
  }
  .opt:active{transform:scale(0.98);}
  @media (hover:hover) and (pointer:fine){
    .opt:hover{border-color:var(--gold-deep);background:var(--gold-tint);}
  }
  .opt:has(input:checked){border-color:var(--gold-deep);background:var(--gold-tint);}
  .opt input{accent-color:var(--gold-deep);}
  .opt.correct{border-color:var(--sage);background:var(--sage-tint);}
  .opt.wrong{border-color:var(--rust);background:var(--rust-tint);}

  .result-banner{
    padding:22px 26px;border:1.5px solid var(--line);margin-bottom:24px;display:flex;
    align-items:center;justify-content:space-between;border-radius:18px;
  }
  .result-banner.pass{background:var(--sage-tint);border-color:var(--sage);}
  .result-banner.fail{background:var(--rust-tint);border-color:var(--rust);}
  .result-score{font-family:var(--serif);font-size:30px;font-weight:800;}
  .result-label{font-size:13px;color:var(--ink-soft);margin-top:2px;}

  /* ---------- Certificate ---------- */
  .cert-wrap{border:1.5px solid var(--gold-deep);border-radius:22px;padding:52px 46px;background:var(--paper-raised);position:relative;max-width:680px;margin:0 auto;box-shadow:var(--shadow-lg);}
  .cert-wrap::before{
    content:"";position:absolute;inset:10px;border:1px solid var(--gold-tint);border-radius:14px;pointer-events:none;
  }
  .cert-org{font-size:12px;letter-spacing:.08em;color:var(--gold-deep);text-align:center;margin-bottom:26px;font-weight:700;}
  .cert-heading{font-family:var(--serif);font-size:15px;color:var(--ink-soft);text-align:center;}
  .cert-name{font-family:var(--serif);font-size:34px;font-weight:800;text-align:center;margin:14px 0;}
  .cert-course{font-size:15px;text-align:center;color:var(--ink-soft);margin-bottom:26px;}
  .cert-course strong{color:var(--ink);font-weight:700;}
  .cert-footer{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-soft);margin-top:30px;padding-top:18px;border-top:1px solid var(--line);}

  /* ---------- Forms ---------- */
  .form-wrap{max-width:440px;}
  .field{margin-bottom:18px;}
  .field label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:6px;font-weight:500;}
  .field input,.field select,.field textarea{
    width:100%;padding:11px 14px;border:1.5px solid var(--line);border-radius:var(--radius-sm);
    font-family:var(--sans);font-size:14px;background:var(--paper-raised);color:var(--ink);
  }
  .field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--gold-tint);border-color:var(--gold-deep);}
  .helper{font-size:12px;color:var(--ink-soft);margin-top:16px;}

  .toast{
    position:fixed;bottom:26px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:var(--paper-raised);padding:12px 22px;border-radius:var(--radius-pill);
    font-size:13.5px;opacity:0;pointer-events:none;transition:opacity 200ms var(--ease-out), transform 200ms var(--ease-out);z-index:50;
    box-shadow:var(--shadow-md);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}

  .empty{padding:40px 20px;text-align:center;color:var(--ink-soft);font-size:14px;}

  /* ---------- Motion: premium feel ---------- */
  @keyframes fadeInUp{ from{opacity:0;transform:translateY(8px);} to{opacity:1;transform:translateY(0);} }
  @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
  @keyframes spin{ to{transform:rotate(360deg);} }
  @keyframes shimmer{ 0%{background-position:-320px 0;} 100%{background-position:320px 0;} }
  @keyframes certReveal{ from{opacity:0;transform:scale(.96) translateY(6px);} to{opacity:1;transform:scale(1) translateY(0);} }
  @keyframes toastPop{ from{opacity:0;transform:translate(-50%,6px) scale(.97);} to{opacity:1;transform:translate(-50%,0) scale(1);} }
  @keyframes checkPop{ from{transform:scale(0.85);opacity:0;} to{transform:scale(1);opacity:1;} }

  .content, .landing{ animation:fadeInUp 260ms var(--ease-out) both; }
  .shell{ animation:fadeIn 220ms var(--ease-out) both; }

  .course-card, .entry-card, .kpi, .module-row{
    animation:fadeInUp 280ms var(--ease-out) both;
    animation-delay:calc(var(--i,0) * 45ms);
  }
  .table-wrap{ animation:fadeInUp 260ms var(--ease-out) both; }
  .cert-wrap{ animation:certReveal 420ms var(--ease-out) both; }
  .result-banner{ animation:fadeInUp 260ms var(--ease-out) both; }
  .toast.show{ animation:toastPop 200ms var(--ease-out) both; }
  .module-num.done{ animation:checkPop 260ms var(--ease-out) both; }

  .progress-fill{ transition:width 550ms var(--ease-out); }

  .spinner{
    width:13px;height:13px;border:2px solid currentColor;border-top-color:transparent;
    border-radius:50%;display:inline-block;vertical-align:-2px;margin-right:7px;
    opacity:.85;animation:spin .65s linear infinite;
  }
  .btn.is-loading{cursor:progress;}

  .skeleton-frame{ background:var(--ink); }
  .skeleton-shimmer{
    width:100%;height:100%;
    background:linear-gradient(90deg, #262c38 0%, #363e4d 50%, #262c38 100%);
    background-size:640px 100%;
    animation:shimmer 1.1s ease-in-out infinite;
  }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;}
  }

  /* ---------- New course builder ---------- */
  .form-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .dropzone{
    border:1.5px dashed var(--line);border-radius:var(--radius-sm);padding:26px 20px;text-align:center;
    color:var(--ink-soft);font-size:13px;background:#FDFDFD;cursor:pointer;transition:border-color 160ms var(--ease-out),background 160ms var(--ease-out);
  }
  .dropzone:hover{border-color:var(--gold-deep);background:var(--gold-tint);}
  .dropzone .dz-icon{font-size:20px;margin-bottom:6px;}
  .dropzone.has-file{border-style:solid;border-color:var(--sage);background:var(--sage-tint);color:var(--sage);}
  .status-toggle{display:flex;border:1.5px solid var(--line);border-radius:var(--radius-pill);overflow:hidden;width:fit-content;}
  .status-toggle button{
    padding:11px 18px;font-size:13px;border:none;background:var(--paper-raised);color:var(--ink-soft);white-space:nowrap;
    transition:background 140ms var(--ease-out), color 140ms var(--ease-out);
  }
  .status-toggle button.active{background:var(--ink);color:#fff;}

  .builder-section{margin-top:34px;padding-top:26px;border-top:1px solid var(--line);}

  /* ---------- Course completion modal ---------- */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(21,22,28,.55);backdrop-filter:blur(2px);

    background:var(--paper-raised);border-radius:22px;padding:40px 34px;max-width:420px;width:100%;

  @keyframes modalPop{ from{opacity:0;transform:scale(.94) translateY(8px);} to{opacity:1;transform:scale(1) translateY(0);} }

    position:absolute;top:14px;right:14px;background:none;border:none;color:var(--ink-soft);

  /* ---------- Explore courses (student catalog) ---------- */
  .explore-card{
    display:flex;gap:18px;border:1px solid var(--line);background:var(--paper-raised);
    border-radius:18px;padding:18px;align-items:center;margin-bottom:14px;box-shadow:var(--shadow-sm);

  /* ---------- Responsive ---------- */

  .content h2{ font-size:clamp(21px, 4.5vw, 27px); }

  .row-actions{ flex-wrap:wrap; }
  .builder-footer{ flex-wrap:wrap; }
  .video-actions{ flex-wrap:wrap; }
  .builder-section-head{ flex-wrap:wrap; gap:8px; }

  .table-wrap{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .table-wrap table{ min-width:560px; }
  .topbar{ flex-wrap:wrap; row-gap:10px; }
  .topbar-right{ flex-wrap:wrap; row-gap:8px; }

  @media(max-width:900px){
    .content{ max-width:100%; }
    .kpi-row-5{grid-template-columns:repeat(3,1fr);}
  }

  @media(max-width:760px){
    .shell{flex-direction:column;align-items:stretch;}
    .sidebar{width:100%;flex-direction:row;overflow-x:auto;padding:14px 12px;border-right:none;border-bottom:1px solid var(--line);-webkit-overflow-scrolling:touch;position:static;height:auto;box-shadow:none;}

  @media(max-width:480px){
    .kpi-row{grid-template-columns:1fr 1fr;gap:10px;}
    .kpi-row-5{grid-template-columns:1fr 1fr;gap:10px;}

    .landing{padding-top:56px;padding-bottom:40px;}

</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   MOCK DATA
   ========================================================= */
const COURSES = [
  {
    id:"c1", title:"Foundations of Character-Based Leadership",
    description:"Core principles of integrity, self-mastery and values-driven decision making for team leads.",
    duration:"4 hours", status:"published", color:"#3B5BFE", price:25000,
    modules:[
      { id:"m1", title:"Defining Character in the Workplace",
        questions:[
          {q:"What does the course define as the foundation of character-based leadership?", options:["Charisma and persuasion","Integrity and consistent values","Seniority and authority","Technical expertise"], correct:1},

          {q:"According to the module, values-driven leaders primarily earn trust through:", options:["Frequent praise","Consistency between words and actions","Strict enforcement of rules","Financial incentives"], correct:1},
          {q:"What is described as the first step to building self-awareness as a leader?", options:["Reading leadership books","Honest reflection on your own patterns","Requesting a promotion","Hiring a coach"], correct:1},
        ]},

        questions:[

          {q:"A leader with strong self-mastery is best described as:", options:["Unemotional and distant","Predictable, calm, and accountable for their reactions","Focused only on results","Reluctant to receive feedback"], correct:1},

          {q:"What is a warning sign of values drift on a team?", options:["Consistent documentation","Rules being quietly bent 'just this once'","Regular team check-ins","Clear escalation paths"], correct:1},
          {q:"The module's closing case study centers on:", options:["A product launch delay","A leader choosing transparency over a convenient cover-up","A budget cut","A hiring decision"], correct:1},
          {q:"What is the recommended first response to a values breach on your team?", options:["Ignore it if performance is good","Address it directly and promptly","Wait for HR to notice","Discuss it publicly in a team meeting"], correct:1},
        ]},
    ]
  },
  {
    id:"c2", title:"Workplace Values & Professional Conduct",
    description:"Practical standards for professionalism, accountability and respectful collaboration in a modern organization.",
    duration:"3 hours", status:"published", color:"#FF6B4A", price:18000,
    modules:[
      { id:"m4", title:"Professionalism in Daily Practice",
        questions:[
          {q:"Professional conduct, as defined in this module, is primarily about:", options:["Formality and dress code","Reliability, respect, and clear communication","Avoiding all conflict","Working independently of the team"], correct:1},
          {q:"Which is an example of accountable communication?", options:["Blaming external factors for missed deadlines","Owning a mistake and proposing a fix","Staying silent about an error","Waiting to be asked before reporting a problem"], correct:1},
          {q:"What does the module suggest doing when you're unsure of an instruction?", options:["Guess and proceed","Ask a clarifying question before starting", "Wait indefinitely","Assume the most convenient interpretation"], correct:1},

      { id:"m5", title:"Respectful Collaboration",

          {q:"The module describes respectful collaboration as requiring:", options:["Agreement on every point","Listening actively and valuing differing views","Avoiding feedback to keep the peace","Working only with people you agree with"], correct:1},
          {q:"What is the recommended way to raise a disagreement with a colleague?", options:["Address it privately and specifically","Post about it publicly","Escalate immediately to management","Avoid the colleague going forward"], correct:0},
        ]},
    ]
  }
];

const REGISTRATIONS = [
  {id:"r1", name:"Aisha Bello", email:"aisha.bello@example.com", phone:"0803 555 1123", interest:"c1", status:"pending", date:"2026-08-27"},
  {id:"r2", name:"Chinedu Okafor", email:"chinedu.okafor@example.com", phone:"0812 442 9981", interest:"c2", status:"pending", date:"2026-08-28"},
  {id:"r3", name:"Grace Adeyemi", email:"grace.adeyemi@example.com", phone:"0906 213 4477", interest:"c1", status:"approved", date:"2026-08-20"},
  {id:"r4", name:"Tunde Salako", email:"tunde.salako@example.com", phone:"0701 998 2210", interest:"c2", status:"rejected", date:"2026-08-19"},
];

const STUDENTS = [
  {id:"s1", name:"Grace Adeyemi", email:"grace.adeyemi@example.com", status:"active", lastActive:"2 hours ago"},
  {id:"s2", name:"Ibrahim Musa", email:"ibrahim.musa@example.com", status:"active", lastActive:"Yesterday"},
  {id:"s3", name:"Ngozi Eze", email:"ngozi.eze@example.com", status:"inactive", lastActive:"14 days ago"},
  {id:"s4", name:"You (Demo Student)", email:"demo.student@example.com", status:"active", lastActive:"Just now"},
];
const DEMO_STUDENT_ID = "s4";
const DEMO_STUDENT_NAME = "You (Demo Student)";

const CERTIFICATES = [
  {id:"cert1", student:"Grace Adeyemi", course:"Foundations of Character-Based Leadership", date:"2026-08-14", status:"active", certNo:"RCV-CERT-88213"},
  {id:"cert2", student:"Ibrahim Musa", course:"Workplace Values & Professional Conduct", date:"2026-08-02", status:"active", certNo:"RCV-CERT-88176"},
];

const ASSIGNMENTS = {
  s1:["c1"], s2:["c2"], s3:["c1","c2"], s4:["c1","c2"],
};

/* =========================================================
   STATE
   ========================================================= */
const state = {
  view:"landing",
  role:null,               // 'admin' | 'student'
  adminTab:"overview",
  currentCourseId:null,
  currentModuleId:null,
  quizAnswers:{},
  quizResult:null,
  registrations: JSON.parse(JSON.stringify(REGISTRATIONS)),
  students: JSON.parse(JSON.stringify(STUDENTS)),
  certificates: JSON.parse(JSON.stringify(CERTIFICATES)),
  draftCourse: null,
  editingCourseId: null,
  newStudentDraft: null,
  viewStudentId: null,
  assignments: JSON.parse(JSON.stringify(ASSIGNMENTS)),
  courseDetailEditIndex: null,   // index of module being edited/added inline, or 'new'
  tempModule: null,
  reportCourseFilter: 'all',
  videoLoading: false,
  completionModal: null,
  quizOrder: null,
  showQuizReview: false,
  registerDraft: null,
  editingStudentDetails: false,
  studentEditDraft: null,
  // student progress: { moduleId: {watched:bool, completed:bool, bestScore:num} }
  progress:{
    m1:{watched:true, completed:true, bestScore:86},
    m2:{watched:true, completed:false, bestScore:null},
  },
  courseCompleted:{}, // courseId -> bool
};

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.remove('show');
  void t.offsetWidth; // restart animation
  t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}

/* ---------- Motion helpers ---------- */
function withLoading(btn, callback, delay){
  if(!btn || btn.disabled) return;
  btn.disabled = true;
  btn.classList.add('is-loading');
  const label = btn.getAttribute('data-loading-text') || 'Please wait…';
  btn.innerHTML = `<span class="spinner"></span>${label}`;
  setTimeout(callback, delay || 500);
}

function animateProgressBars(){
  document.querySelectorAll('.progress-fill[data-target]').forEach(el=>{
    const target = el.getAttribute('data-target');
    el.style.width = '0%';
    requestAnimationFrame(()=>requestAnimationFrame(()=>{ el.style.width = target + '%'; }));
  });
}

function animateKpiCounts(){
  document.querySelectorAll('.kpi-value[data-target]').forEach(el=>{
    const target = parseInt(el.getAttribute('data-target'),10) || 0;
    const start = performance.now();
    const dur = 550;
    function tick(now){
      const p = Math.min(1, (now-start)/dur);
      const eased = 1 - Math.pow(1-p, 3);
      el.textContent = Math.round(eased*target);
      if(p<1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  });
}

function go(view, extra={}){
  if(view !== 'adminStudentDetail'){
    state.editingStudentDetails = false;
    state.studentEditDraft = null;
  }
  Object.assign(state, {view}, extra);
  render();
  window.scrollTo(0,0);
}

/* =========================================================
   PROGRESS HELPERS
   ========================================================= */
function moduleState(courseId, moduleId){
  const course = COURSES.find(c=>c.id===courseId);
  const idx = course.modules.findIndex(m=>m.id===moduleId);
  const p = state.progress[moduleId] || {watched:false, completed:false, bestScore:null};
  if(idx===0) return {...p, locked:false};
  const prev = course.modules[idx-1];
  const prevDone = state.progress[prev.id]?.completed;
  return {...p, locked:!prevDone};
}

function courseProgressPct(course){
  const total = course.modules.length;
  const done = course.modules.filter(m=>state.progress[m.id]?.completed).length;
  return Math.round((done/total)*100);
}

function isCourseComplete(course){
  return course.modules.every(m=>state.progress[m.id]?.completed);
}

function maybeIssueCertificate(course){
  if(isCourseComplete(course) && !state.certificates.find(c=>c.course===course.title && c.student===DEMO_STUDENT_NAME)){
    const cert = {
      id:"cert-"+Date.now(), student:DEMO_STUDENT_NAME, course:course.title,
      date: new Date().toISOString().slice(0,10), status:"active",
      certNo:"RCV-CERT-"+Math.floor(80000+Math.random()*9000)
    };
    state.certificates.unshift(cert);
    state.completionModal = { courseTitle: course.title, certId: cert.id };
  }
}

/* ---------- Course completion popup ---------- */
function renderCompletionModal(){
  const m = state.completionModal;
  if(!m) return '';
  return `
  <div class="modal-overlay" onclick="if(event.target===this) closeCompletionModal()">
    <div class="modal-card">
      <button class="modal-close" onclick="closeCompletionModal()" aria-label="Close">✕</button>
      <div class="modal-badge">🎉</div>
      <div class="modal-eyebrow">Course completed</div>
      <h3 class="modal-title">${m.courseTitle}</h3>
      <p class="modal-body">Congratulations — you've finished every module and passed every test. Your certificate has been generated and is ready to view.</p>
      <div class="modal-actions">
        <button class="btn gold" onclick="viewCompletionCertificate()">View Certificate</button>
        <button class="btn ghost" onclick="closeCompletionModal()">Keep Learning</button>
      </div>
    </div>
  </div>`;
}
function closeCompletionModal(){
  state.completionModal = null;
  render();
}
function viewCompletionCertificate(){
  const certId = state.completionModal?.certId;
  state.completionModal = null;
  go('certificateView', { viewCertId: certId, studentTab: 'certificates' });
}

/* ---------- Assignment helpers (Section 5.5) ---------- */
function assignedCourseIds(studentId){
  return state.assignments[studentId] || [];
}
function assignedCourses(studentId){
  return COURSES.filter(c=>assignedCourseIds(studentId).includes(c.id));
}
function toggleAssignment(studentId, courseId){
  const arr = state.assignments[studentId] = state.assignments[studentId] || [];
  const idx = arr.indexOf(courseId);
  const course = COURSES.find(c=>c.id===courseId);
  if(idx>-1){
    arr.splice(idx,1);
    toast(`Access to "${course.title}" revoked — progress is preserved`);
  } else {
    if(course.status !== 'published'){ toast('Warning: this course has no published modules yet'); }
    arr.push(courseId);
    toast(`"${course.title}" assigned — student notified by email`);
  }
  render();
}

function formatPrice(n){
  if(n == null) return '—';
  return '₦' + Number(n).toLocaleString('en-NG');
}

/* ---------- Student self-enrollment (Explore Courses) ---------- */
function enrollInCourse(courseId){
  const course = COURSES.find(c=>c.id===courseId);
  const alreadyRequested = state.registrations.find(r=>r.existingStudentId===DEMO_STUDENT_ID && r.interest===courseId && r.status==='pending');
  if(alreadyRequested){ toast('You already have a pending request for this course'); return; }
  state.registrations.unshift({
    id:'r'+Date.now(), name:DEMO_STUDENT_NAME, email:'demo.student@example.com', phone:'—',
    interest:courseId, status:'pending', date:new Date().toISOString().slice(0,10),
    existingStudentId:DEMO_STUDENT_ID
  });
  toast(`Request sent for "${course.title}" — pending admin approval`);
  render();
}

/* ---------- Deterministic mock progress for non-demo students ---------- */
function seedRand(str){
  let h = 0;
  for(let i=0;i<str.length;i++){ h = (h<<5)-h+str.charCodeAt(i); h|=0; }
  return Math.abs(h % 1000)/1000;
}
function mockCompletedCount(studentId, course){
  return Math.floor(seedRand(studentId+course.id) * (course.modules.length+1));
}
function studentModuleProgress(studentId, course, module, moduleIndex){
  if(studentId === DEMO_STUDENT_ID){
    const p = state.progress[module.id] || {};
    return {completed: !!p.completed, bestScore: p.bestScore ?? null};
  }
  const completedCount = mockCompletedCount(studentId, course);
  const completed = moduleIndex < completedCount;
  const bestScore = completed ? 70 + Math.floor(seedRand(studentId+module.id+'s') * 30) : null;
  return {completed, bestScore};
}
function studentCourseComplete(studentId, course){
  if(studentId === DEMO_STUDENT_ID) return isCourseComplete(course);
  return mockCompletedCount(studentId, course) >= course.modules.length;
}
function getCompletionDate(studentId, studentName, course){
  const cert = state.certificates.find(c=>c.course===course.title && c.student===studentName);
  if(cert) return cert.date;
  return '2026-08-' + String(10 + Math.floor(seedRand(studentId+course.id+'d')*18)).padStart(2,'0');
}

/* =========================================================
   RENDER: SHELL PIECES
   ========================================================= */
function topbar(){
  const roleLabel = state.role === 'admin' ? 'Admin Console' : state.role === 'student' ? 'Student Portal' : '';
  const initial = state.role === 'admin' ? 'A' : state.role === 'student' ? 'D' : '';
  return `
  <div class="topbar">
    <div class="brand" onclick="go('landing')">
      <div class="brand-mark">R</div>
      <div>
        <div class="brand-name">RCV Training Portal</div>
        <div class="brand-sub">${roleLabel || 'Prototype — 1st Royal Character &amp; Values Ltd'}</div>
      </div>
    </div>
    <div class="topbar-right">
      ${state.role ? `

function submitRegistration(){
  const d = state.registerDraft;
  if(!d.name.trim() || !d.email.trim() || !d.phone.trim()){
    toast('Please fill in your name, email and phone number');
    return;
  }
  const email = d.email.trim().toLowerCase();
  const hasPending = state.registrations.some(r => r.email.trim().toLowerCase() === email && r.status === 'pending');
  if(hasPending){
    toast('A pending request already exists for this email address');
    return;
  }
  state.registrations.unshift({
    id:'r'+Date.now(), name:d.name, email:d.email, phone:d.phone,
    interest:d.course, status:'pending', date:new Date().toISOString().slice(0,10)
  });

  go('landing');
}

function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function openModule(courseId, moduleId){
  const ms = moduleState(courseId, moduleId);
  if(ms.locked){ toast("This module is locked — finish the previous one first."); return; }
  const course = COURSES.find(c=>c.id===courseId);
  const module = course.modules.find(m=>m.id===moduleId);
  state.videoLoading = true;
  go('moduleView', {currentCourseId:courseId, currentModuleId:moduleId, quizResult:null, quizAnswers:{}, quizOrder: shuffle(module.questions.map((_,i)=>i)), showQuizReview:false});
  setTimeout(()=>{ state.videoLoading = false; render(); }, 650);
}

/* ---------- Module view (video + test) ---------- */

    testBlock = renderQuizForm(module, false);
  }

  const videoLoading = state.videoLoading;

  return `${topbar()}<div class="shell">${studentSidebar('dashboard')}
  <div class="content">
    <a class="back-link" onclick="go('courseView',{currentCourseId:'${course.id}'})" style="cursor:pointer">&larr; ${course.title}</a>

    <div class="video-frame skeleton-frame">

      <div class="play-btn">▶</div>
      <div class="video-caption">${module.title} — embedded lesson video</div>
    </div>`}
    <div class="video-actions">
      ${videoLoading ? '' : ms.watched
        ? `<span class="watched-tag">✓ Marked as watched</span>`
        : `<button class="btn gold" onclick="withLoading(this,function(){markWatched('${module.id}')})" data-loading-text="Saving…">Mark as Watched</button>`}
    </div>

    <div class="quiz-card">
      <h3 style="font-family:var(--serif);font-size:19px;margin:0 0 4px;">Module Test</h3>
      <p class="subtitle" style="margin-bottom:22px;">${module.questions.length} questions · Pass mark 70% · Unlimited retries</p>
      ${testBlock}
    </div>
  </div></div>`;

function renderQuizForm(module, isRetry){
  const order = (state.quizOrder && state.quizOrder.length === module.questions.length) ? state.quizOrder : module.questions.map((_,i)=>i);
  return `
  ${order.map((qi,displayIdx)=>{
    const q = module.questions[qi];
    return `
    <div class="q-block">
      <div class="q-num">Question ${displayIdx+1} of ${order.length}</div>
      <div class="q-text">${q.q}</div>
      ${q.options.map((o,oi)=>`
        <label class="opt">
          <input type="radio" name="q${qi}" value="${oi}" onchange="setAnswer('${module.id}',${qi},${oi})">
          ${o}
        </label>`).join('')}
    </div>
  `;
  }).join('')}
  <button class="btn gold" onclick="withLoading(this,function(){submitQuiz('${module.id}')},700)" data-loading-text="Grading…">${isRetry ? 'Submit Retry' : 'Submit Test'}</button>
  `;
}

function renderQuizReview(review){
  return `<div class="quiz-review">${review.map((item,idx)=>`
    <div class="q-block">
      <div class="q-num">Question ${idx+1}</div>
      <div class="q-text">${item.text}</div>
      ${item.options.map((o,oi)=>{
        let cls = '';
        if(oi === item.correctIndex) cls = 'correct';
        else if(oi === item.selected && !item.isCorrect) cls = 'wrong';
        return `<div class="opt ${cls}" style="cursor:default">${o}${oi===item.selected ? ' — your answer' : ''}</div>`;
      }).join('')}
    </div>
  `).join('')}</div>`;
}
function toggleQuizReview(){
  state.showQuizReview = !state.showQuizReview;
  render();
}

function markWatched(moduleId){
  state.progress[moduleId] = {...(state.progress[moduleId]||{}), watched:true, completed: state.progress[moduleId]?.completed || false, bestScore: state.progress[moduleId]?.bestScore ?? null};
  toast("Video marked as watched");
  render();
}

function setAnswer(moduleId, qIndex, optIndex){
  state.quizAnswers[qIndex] = optIndex;
}

function submitQuiz(moduleId){
  const course = COURSES.find(c=>c.id===state.currentCourseId);
  const module = course.modules.find(m=>m.id===moduleId);
  const total = module.questions.length;
  let correct = 0;
  const review = module.questions.map((q,i)=>{
    const selected = state.quizAnswers[i];
    const isCorrect = selected === q.correct;
    if(isCorrect) correct++;
    return { text:q.q, options:q.options, selected, correctIndex:q.correct, isCorrect };
  });
  const score = Math.round((correct/total)*100);
  const pass = score >= 70;
  const prev = state.progress[moduleId] || {};
  state.progress[moduleId] = {
    watched:true,
    completed: pass || prev.completed || false,
    bestScore: Math.max(score, prev.bestScore || 0)
  };
  state.quizResult = {score, pass, review};
  render();
  if(pass) maybeIssueCertificate(course);
}

function retryQuiz(){
  const course = COURSES.find(c=>c.id===state.currentCourseId);
  const module = course.modules.find(m=>m.id===state.currentModuleId);
  state.quizResult = null;
  state.quizAnswers = {};
  state.quizOrder = shuffle(module.questions.map((_,i)=>i));
  state.showQuizReview = false;
  render();
}

  const r = state.registrations.find(x=>x.id===id);

      const arr = state.assignments[r.existingStudentId] = state.assignments[r.existingStudentId] || [];
      if(!arr.includes(r.interest)) arr.push(r.interest);
      const course = COURSES.find(c=>c.id===r.interest);

function deleteCourse(courseId){
  const c = COURSES.find(x=>x.id===courseId);
  const hasAssignments = Object.values(state.assignments).some(arr=>arr.includes(courseId));

  COURSES.splice(idx,1);
  toast(`"${c.title}" deleted`);
  render();
}

        </div>
      </div>
      <div class="field"><label>Test pass threshold</label>
        <input type="number" min="0" max="100" value="${m.passThreshold}" oninput="updateModuleField(${mi},'passThreshold',this.value)" />
      </div>
    </div>

    <div style="margin-top:14px">
      <div class="q-editor-head"><span>Test questions (${m.questions.length})</span>
        <button class="link-btn" onclick="addDraftQuestion(${mi})">+ Add question</button>
      </div>
      ${m.questions.map((q,qi)=>renderQuestionEditor(m,mi,q,qi)).join('')}
    </div>
  </div>`;
}

function renderQuestionEditor(m, mi, q, qi){
  return `
  <div class="q-editor">
    <div class="q-editor-head">
      <span>Question ${qi+1}</span>
      ${m.questions.length>1 ? `<button class="remove-x" onclick="removeDraftQuestion(${mi},${qi})" title="Remove question">✕</button>` : ''}
    </div>
    <div class="field" style="margin-bottom:10px">
      <input type="text" value="${escapeAttr(q.text)}" placeholder="Question text" oninput="updateQuestionField(${mi},${qi},'text',this.value)" />
    </div>
    ${q.options.map((o,oi)=>`
      <div class="q-opt-row">
        <input type="radio" name="correct-${mi}-${qi}" ${q.correct===oi?'checked':''} onchange="setCorrectOption(${mi},${qi},${oi})" title="Mark as correct answer">
        <input type="text" value="${escapeAttr(o)}" placeholder="Option ${oi+1}" oninput="updateOptionField(${mi},${qi},${oi},this.value)">
      </div>
    `).join('')}
    <div class="helper" style="margin-top:2px">Select the radio button beside the correct answer.</div>
  </div>`;
}

function escapeAttr(s){ return (s||'').replace(/"/g,'&quot;'); }

function updateDraft(field, value){ state.draftCourse[field] = value; }
function setDraftStatus(status){ state.draftCourse.status = status; render(); }
function mockUploadThumbnail(){ state.draftCourse.thumbnail = 'course-thumbnail.jpg'; toast('Thumbnail attached'); render(); }
function mockUploadVideo(mi){ state.draftCourse.modules[mi].videoUrl = 'youtube.com/unlisted/lesson-'+(mi+1); toast('Video attached'); render(); }

function updateModuleField(mi, field, value){ state.draftCourse.modules[mi][field] = value; }
function addDraftModule(){ state.draftCourse.modules.push(blankModule()); render(); }
function removeDraftModule(mi){ state.draftCourse.modules.splice(mi,1); render(); }

function updateQuestionField(mi, qi, field, value){ state.draftCourse.modules[mi].questions[qi][field] = value; }
function updateOptionField(mi, qi, oi, value){ state.draftCourse.modules[mi].questions[qi].options[oi] = value; }
function setCorrectOption(mi, qi, oi){ state.draftCourse.modules[mi].questions[qi].correct = oi; }
function addDraftQuestion(mi){ state.draftCourse.modules[mi].questions.push(blankQuestion()); render(); }
function removeDraftQuestion(mi, qi){ state.draftCourse.modules[mi].questions.splice(qi,1); render(); }

function saveDraftCourse(){
  const d = state.draftCourse;
  if(!d.title.trim()){ toast('Give the course a title before saving'); return; }
  if(state.editingCourseId){
    const c = COURSES.find(x=>x.id===state.editingCourseId);
    c.title = d.title; c.description = d.description || 'No description provided.';
    c.duration = d.duration || '—'; c.status = d.status; c.price = d.price === '' ? null : Number(d.price);
    c.modules = d.modules.map((m,i)=>({
      id: (COURSES.find(x=>x.id===state.editingCourseId).modules[i]?.id) || ('m'+Date.now()+i),
      title: m.title || `Module ${i+1}`,
      videoUrl: m.videoUrl, passThreshold: m.passThreshold,
      questions: m.questions.map(q=>({q:q.text||'Untitled question', options:q.options, correct:q.correct}))
    }));
    toast('Course updated');
  } else {
    const newCourse = {
      id:'c'+Date.now(),
      title:d.title, description:d.description || 'No description provided.',
      duration:d.duration || '—', status:d.status, color:'#0EA5A0', price: d.price === '' ? null : Number(d.price),
      modules:d.modules.map((m,i)=>({
        id:'m'+Date.now()+i, title:m.title || `Module ${i+1}`,
        videoUrl:m.videoUrl, passThreshold:m.passThreshold,
        questions:m.questions.map(q=>({q:q.text||'Untitled question', options:q.options, correct:q.correct}))
      }))
    };
    COURSES.push(newCourse);
    toast(d.status==='published' ? 'Course published' : 'Course saved as draft');
  }
  state.draftCourse = null;
  state.editingCourseId = null;
  go('adminDashboard',{adminTab:'courses'});
}

function cancelNewCourse(){
  state.draftCourse = null;
  state.editingCourseId = null;
  go('adminDashboard',{adminTab:'courses'});
}

function renderAdminCourseDetail(){
  const course = COURSES.find(c=>c.id===state.currentCourseId);
  const editIdx = state.courseDetailEditIndex;
  return `${topbar()}<div class="shell">${adminSidebar('courses')}
  <div class="content" style="max-width:760px">
    <a class="back-link" onclick="go('adminDashboard',{adminTab:'courses'})" style="cursor:pointer">&larr; Courses</a>
    <h2>${course.title}</h2>
    <p class="subtitle">${course.modules.length} modules · ${course.duration} · <span class="badge ${course.status}">${course.status}</span></p>

    <div class="builder-section-head" style="margin-top:0">
      <h3 style="font-size:19px">Modules</h3>
      ${editIdx===null ? `<button class="link-btn" onclick="startAddModule('${course.id}')">+ Add module</button>` : ''}
    </div>

    <div class="module-list" style="margin-bottom:20px">
      ${course.modules.map((m,i)=>{
        if(editIdx===i){
          return `<div style="padding:18px 20px;border-bottom:1px solid var(--line)">${renderTempModuleEditor(course.id)}</div>`;
        }
        const hasProgress = !!state.progress[m.id];
        return `
        <div class="module-row">
          <div class="reorder-col">
            <button class="reorder-btn" ${i===0?'disabled':''} onclick="moveModule('${course.id}',${i},-1)" title="Move up">▲</button>
            <button class="reorder-btn" ${i===course.modules.length-1?'disabled':''} onclick="moveModule('${course.id}',${i},1)" title="Move down">▼</button>
          </div>
          <div class="module-num">${i+1}</div>
          <div class="module-info">
            <div class="mtitle">${m.title} ${m.isActive===false ? '<span class="badge draft" style="margin-left:6px">Inactive</span>' : ''}</div>
            <div class="mstate">${m.questions.length} test questions · Pass mark ${m.passThreshold||70}%</div>
          </div>
          <div class="row-actions">
            <button class="btn small ghost" onclick="startEditModule('${course.id}',${i})">Edit</button>
            <button class="btn small ghost" onclick="toggleModuleActive('${course.id}',${i})">${m.isActive===false?'Activate':'Deactivate'}</button>
            <button class="btn small ghost" onclick="deleteModule('${course.id}',${i})">Delete</button>
          </div>
        </div>`;
      }).join('')}
      ${editIdx==='new' ? `<div style="padding:18px 20px">${renderTempModuleEditor(course.id)}</div>` : ''}
    </div>
  </div></div>`;
}

/* ---------- Inline module edit/add within course detail ---------- */
function startAddModule(courseId){
  state.courseDetailEditIndex = 'new';
  state.tempModule = blankModule();
  render();
}
function startEditModule(courseId, index){
  const course = COURSES.find(c=>c.id===courseId);
  const m = course.modules[index];
  state.courseDetailEditIndex = index;
  state.tempModule = {
    title:m.title, videoUrl:m.videoUrl||'youtube.com/unlisted/existing-video', passThreshold:m.passThreshold||70,
    questions: m.questions.map(q=>({text:q.q, options:[...q.options], correct:q.correct}))
  };
  render();
}
function cancelModuleEdit(){
  state.courseDetailEditIndex = null;
  state.tempModule = null;
  render();
}
function updateTempModuleField(field, value){ state.tempModule[field] = value; }
function mockUploadTempVideo(){ state.tempModule.videoUrl = 'youtube.com/unlisted/lesson-'+Date.now(); toast('Video attached'); render(); }
function updateTempQuestionField(qi, field, value){ state.tempModule.questions[qi][field] = value; }
function updateTempOptionField(qi, oi, value){ state.tempModule.questions[qi].options[oi] = value; }
function setTempCorrectOption(qi, oi){ state.tempModule.questions[qi].correct = oi; }
function addTempQuestion(){ state.tempModule.questions.push(blankQuestion()); render(); }
function removeTempQuestion(qi){ state.tempModule.questions.splice(qi,1); render(); }

function saveModuleEdit(courseId){
  const course = COURSES.find(c=>c.id===courseId);
  const t = state.tempModule;
  if(!t.title.trim()){ toast('Give the module a title before saving'); return; }
  const built = {
    title:t.title, videoUrl:t.videoUrl, passThreshold:t.passThreshold,
    questions:t.questions.map(q=>({q:q.text||'Untitled question', options:q.options, correct:q.correct}))
  };
  if(state.courseDetailEditIndex === 'new'){
    built.id = 'm'+Date.now();
    course.modules.push(built);
    toast('Module added');
  } else {
    const idx = state.courseDetailEditIndex;
    built.id = course.modules[idx].id;
    built.isActive = course.modules[idx].isActive;
    course.modules[idx] = built;
    toast('Module updated');
  }
  state.courseDetailEditIndex = null;
  state.tempModule = null;
  render();
}

function toggleModuleActive(courseId, index){
  const course = COURSES.find(c=>c.id===courseId);
  const m = course.modules[index];
  m.isActive = m.isActive === false ? true : false;
  toast(`"${m.title}" ${m.isActive===false ? 'deactivated — hidden from students' : 'activated'}`);
  render();
}

function deleteModule(courseId, index){
  const course = COURSES.find(c=>c.id===courseId);
  const m = course.modules[index];
  if(state.progress[m.id]){
    toast('Cannot delete — students have progress recorded. Deactivate instead.');
    return;
  }
  course.modules.splice(index,1);
  toast(`"${m.title}" deleted`);
  render();
}

function moveModule(courseId, index, direction){
  const course = COURSES.find(c=>c.id===courseId);
  const target = index + direction;
  if(target < 0 || target >= course.modules.length) return;
  const modules = course.modules;
  [modules[index], modules[target]] = [modules[target], modules[index]];
  toast('Module order updated');
  render();
}

function renderTempModuleEditor(courseId){
  const t = state.tempModule;
  return `
  <div class="field"><label>Module title</label>
    <input value="${escapeAttr(t.title)}" placeholder="e.g. Setting Priorities That Matter" oninput="updateTempModuleField('title',this.value)" />
  </div>
  <div class="form-grid-2">
    <div class="field"><label>Lesson video</label>
      <div class="dropzone ${t.videoUrl ? 'has-file' : ''}" onclick="mockUploadTempVideo()">
        <div class="dz-icon">${t.videoUrl ? '✓' : '▶'}</div>
        ${t.videoUrl ? escapeAttr(t.videoUrl) : 'Click to attach a YouTube unlisted URL'}
      </div>
    </div>
    <div class="field"><label>Test pass threshold</label>
      <input type="number" min="0" max="100" value="${t.passThreshold}" oninput="updateTempModuleField('passThreshold',this.value)" />
    </div>
  </div>
  <div style="margin-top:14px">
    <div class="q-editor-head"><span>Test questions (${t.questions.length})</span>
      <button class="link-btn" onclick="addTempQuestion()">+ Add question</button>
    </div>
    ${t.questions.map((q,qi)=>`
      <div class="q-editor">
        <div class="q-editor-head">
          <span>Question ${qi+1}</span>
          ${t.questions.length>1 ? `<button class="remove-x" onclick="removeTempQuestion(${qi})" title="Remove question">✕</button>` : ''}
        </div>
        <div class="field" style="margin-bottom:10px">
          <input type="text" value="${escapeAttr(q.text)}" placeholder="Question text" oninput="updateTempQuestionField(${qi},'text',this.value)" />
        </div>
        ${q.options.map((o,oi)=>`
          <div class="q-opt-row">
            <input type="radio" name="temp-correct-${qi}" ${q.correct===oi?'checked':''} onchange="setTempCorrectOption(${qi},${oi})" title="Mark as correct answer">
            <input type="text" value="${escapeAttr(o)}" placeholder="Option ${oi+1}" oninput="updateTempOptionField(${qi},${oi},this.value)">
          </div>
        `).join('')}
      </div>
    `).join('')}
  </div>
  <div class="builder-footer" style="margin-top:20px;padding-top:18px">
    <button class="btn gold small" onclick="withLoading(this,function(){saveModuleEdit('${courseId}')},600)" data-loading-text="Saving…">Save Module</button>
    <button class="btn ghost small" onclick="cancelModuleEdit()">Cancel</button>
  </div>`;
}

function adminReports(){
  const filter = state.reportCourseFilter || 'all';
  const activeStudents = state.students.filter(s=>s.status==='active');

  const overviewRows = activeStudents.map(s=>{
    const mine = assignedCourses(s.id);
    const completedCount = mine.filter(c=>studentCourseComplete(s.id,c)).length;
    return {student:s, enrolled:mine.length, completed:completedCount};
  });

  const filterCourses = filter==='all' ? COURSES : COURSES.filter(c=>c.id===filter);
  const completionRows = filterCourses.flatMap(c =>
    activeStudents.filter(s=>assignedCourseIds(s.id).includes(c.id) && studentCourseComplete(s.id,c))
      .map(s=>({student:s.name, course:c.title, date:getCompletionDate(s.id, s.name, c)}))
  );

  return `
  <h2>Progress &amp; Reports</h2>
  <p class="subtitle">Completion status across students and courses.</p>

  <div class="section-block">
    <h3>Overview</h3>
    <div class="table-wrap"><table>
      <tr><th>Student</th><th>Enrolled Courses</th><th>Completed Courses</th><th>Last Active</th><th></th></tr>
      ${overviewRows.map(r=>`
        <tr class="clickable-row" onclick="go('adminStudentDetail',{viewStudentId:'${r.student.id}'})">
          <td>${r.student.name}</td><td>${r.enrolled}</td><td>${r.completed}</td><td>${r.student.lastActive}</td>
          <td><button class="btn small ghost" onclick="event.stopPropagation();go('adminStudentDetail',{viewStudentId:'${r.student.id}'})">View</button></td>
        </tr>
      `).join('')}
    </table></div>
  </div>

  <div class="section-block">
    <h3>Course Completion Report</h3>
    <div class="filter-row">
      <label style="font-size:12.5px;color:var(--ink-soft)">Filter by course:</label>
      <select onchange="state.reportCourseFilter=this.value;render()">
        <option value="all" ${filter==='all'?'selected':''}>All courses</option>
        ${COURSES.map(c=>`<option value="${c.id}" ${filter===c.id?'selected':''}>${c.title}</option>`).join('')}
      </select>
    </div>
    <div class="table-wrap"><table>
      <tr><th>Student</th><th>Course</th><th>Completion Date</th></tr>
      ${completionRows.length ? completionRows.map(r=>`
        <tr><td>${r.student}</td><td>${r.course}</td><td>${r.date}</td></tr>
      `).join('') : `<tr><td colspan="3"><div class="empty">No completions yet for this filter.</div></td></tr>`}
    </table></div>
  </div>`;
}

function adminCertificates(){
  return `
  <h2>Certificates</h2>
  <p class="subtitle">All certificates issued across courses. Revoking removes student download access immediately.</p>
  <div class="table-wrap"><table>
    <tr><th>Student</th><th>Course</th><th>Certificate ID</th><th>Issued</th><th>Status</th><th></th></tr>
    ${state.certificates.map(c=>`
      <tr>
        <td>${c.student}</td><td>${c.course}</td><td>${c.certNo}</td><td>${c.date}</td>
        <td><span class="badge ${c.status}">${c.status}</span></td>
        <td class="row-actions">
          <button class="btn small ghost" onclick="toggleCertStatus('${c.id}')">${c.status==='active' ? 'Revoke' : 'Reinstate'}</button>
        </td>
      </tr>
    `).join('')}
  </table></div>`;
}

function toggleCertStatus(id){
  const c = state.certificates.find(x=>x.id===id);
  c.status = c.status === 'active' ? 'revoked' : 'active';
  toast(`Certificate ${c.certNo} ${c.status === 'revoked' ? 'revoked' : 'reinstated'}`);
  render();
}

/* =========================================================
   ROUTER
   ========================================================= */
function render(){
  const app = document.getElementById('app');
  let html = '';
  switch(state.view){
    case 'landing': html = renderLanding(); break;
    case 'register': html = renderRegister(); break;
    case 'studentLogin': html = renderLoginGate('student'); break;
    case 'adminLogin': html = renderLoginGate('admin'); break;
    case 'studentDashboard': html = renderStudentDashboard(); break;
    case 'courseView': html = renderCourseView(); break;
    case 'moduleView': html = renderModuleView(); break;
    case 'certificateView': html = renderCertificateView(); break;
    case 'adminDashboard': html = renderAdminDashboard(); break;
    case 'adminCourseDetail': html = renderAdminCourseDetail(); break;
    case 'adminNewCourse': html = renderAdminNewCourse(); break;
    case 'adminNewStudent': html = renderAdminNewStudent(); break;
    case 'adminStudentDetail': html = renderAdminStudentDetail(); break;
    default: html = renderLanding();
  }
  app.innerHTML = html + renderCompletionModal();
  animateProgressBars();
  animateKpiCounts();
}

render();
</script>
</body>
</html>
